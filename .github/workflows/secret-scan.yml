# Secret-leak guard: scans every push and pull request for API keys,
# passwords and tokens accidentally committed to the code.
#
# Uses gitleaks (pinned version, download verified by SHA-256 checksum). It
# scans the full git history, so a key that was committed and later deleted
# is still caught -- deleting it does not un-leak it; rotate it instead.
# Findings are redacted in the log. Known false alarms are listed, with a
# reason, in .gitleaksignore at the repo root.
#
# Needs no secrets of its own. Read-only: never pushes or comments.
# If the download or checksum fails, the run fails red and the summary says
# the scan did not run (not that a secret was found) -- re-run it. It never
# silently passes without scanning.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - name: Check out with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        id: install
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 60 --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the whole history for secrets
        id: scan
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: Write a plain-language summary
        if: ${{ always() }}
        run: |
          {
            echo "## Secret scan"
            if [ "${{ steps.scan.outcome }}" = "success" ]; then
              echo "No secrets found in the code or its history."
            elif [ "${{ steps.install.outcome }}" != "success" ]; then
              echo "**The scan did not run** -- the scanner could not be downloaded or failed its checksum check."
              echo "This is not a finding. Re-run the job from the Actions tab; if it keeps failing, check the pinned version and checksum."
            elif [ "${{ steps.scan.outcome }}" != "failure" ]; then
              echo "**The scan did not finish** (cancelled or timed out). This is not a finding -- re-run the job."
            else
              echo "**A possible secret was found.** The log above shows which file and line (the value is hidden)."
              echo ""
              echo "1. If it is a real key: revoke/rotate it with the provider first, then remove it from the code."
              echo "2. If it is a harmless example: add its Fingerprint line to .gitleaksignore with a comment saying why."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
