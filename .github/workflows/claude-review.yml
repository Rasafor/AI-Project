# AI code review on every pull request into main.
#
# Claude reads the pull request's changes and posts a review: inline comments
# on specific lines, plus one summary comment. It complements (does not
# replace) pr-standards.yml, which runs the fixed rule checks and tests.
#
# Secrets: the Anthropic API key is read ONLY from the repository secret
# ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions). It is never
# written in this file or anywhere in the code. GitHub hides it in logs.
#
# Failure modes handled:
#   - Secret not set (e.g. on the second remote) -> review is skipped with a
#     plain-language note; the run stays green.
#   - Pull request from a fork -> GitHub withholds secrets, so the job is
#     skipped (this repo is public; forks must never get the key).
#   - Draft pull request -> skipped until marked "Ready for review".
#   - Hang or runaway cost -> 15-minute job ceiling and a 20-turn cap.
#   - Newer push while a review runs -> the stale review is cancelled.
# Not handled: Anthropic outage or rate limit -> the run fails red; re-run it
# from the Actions tab. The review is advice only and never blocks a merge.

name: Claude AI review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write  # to post review comments; nothing else is writable

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only used to test "is the secret set?" below; the value is masked.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Explain skip if the API key secret is missing
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::AI review skipped: the ANTHROPIC_API_KEY secret is not set for this repository."
          echo "AI review skipped: add the ANTHROPIC_API_KEY secret under Settings -> Secrets and variables -> Actions." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the pull request
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Claude reviews the changes
        if: env.HAS_KEY == 'true'
        # Pinned to an exact commit (what the v1 tag pointed to on 2026-09-27)
        # so the code that handles the API key cannot change underneath us.
        # To upgrade: gh api repos/anthropics/claude-code-action/commits/v1 --jq .sha
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true  # one summary comment, updated on each push
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first; its rules are the
            standard. Focus on real problems, most serious first:
              1. Bugs and wrong behaviour.
              2. Security: secrets or keys in code, unsafe input handling.
              3. CLAUDE.md rules: explicit timeouts and capped retries on
                 external calls, idempotent side effects, no swallowed errors,
                 tests for the happy path and at least one failure path.
            Skip style nits (ruff already checks style).

            Put each specific issue as an inline comment on the line it is
            about. Then post ONE short summary comment in plain language a
            non-technical reader can follow, ending with a verdict:
            "Looks good", "Minor suggestions", or "Needs changes".
            Never quote the value of anything that looks like a secret.

            On a re-review (new push), first read the existing comments with
            `gh pr view --comments` and `gh pr diff`. Do not repeat an issue
            that is already raised and unchanged; only comment on what is new
            or still unresolved. Keep a single summary: if an earlier
            "AI review summary" comment exists, say in the new one which
            earlier points are now fixed.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
